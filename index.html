<!DOCTYPE html>
<html>
<head>
<title>AI Marketing Generator</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>
body {
    font-family: 'Segoe UI';
    background:#0f172a;
    color:white;
    text-align:center;
}

.box {
    background:white;
    color:black;
    padding:20px;
    border-radius:12px;
    max-width:900px;
    margin:auto;
}

.chat-box {
    background:#020617;
    padding:20px;
    border-radius:12px;
    margin-bottom:15px;
}

/* CARD */
.card {
    background:#1e293b;
    padding:18px;
    margin:15px 0;
    border-radius:12px;
    text-align:left;
}

.card h3 {
    color:#22c55e;
    margin-bottom:10px;
}

/* 🔥 FIXED TEXT VISIBILITY */
.card p {
    margin:6px 0;
    line-height:1.7;
    color:#f1f5f9; /* bright readable */
    font-size:14px;
}

/* LOADER */
.loader {
    text-align:center;
    font-size:18px;
    color:#22c55e;
    animation: blink 1s infinite;
}

@keyframes blink {
    0% {opacity:0.3}
    50% {opacity:1}
    100% {opacity:0.3}
}

input,select {
    width:90%;
    padding:10px;
    margin:10px;
}

button {
    padding:10px;
    margin:5px;
    background:green;
    color:white;
    border:none;
    cursor:pointer;
}
</style>
</head>

<body>

<h2>🚀 AI Marketing Generator</h2>

<div class="box">

<div id="signupPage">
<h3>Signup</h3>
<input id="signupUsername" placeholder="Username">
<input id="signupPassword" type="password">
<input id="confirmPassword" type="password">
<button onclick="signup()">Signup</button>
<p onclick="showLogin()" style="cursor:pointer;color:blue">Login</p>
</div>

<div id="loginPage" style="display:none">
<h3>Login</h3>
<input id="loginUsername">
<input id="loginPassword" type="password">
<button onclick="login()">Login</button>
<p onclick="showSignup()" style="cursor:pointer;color:blue">Signup</p>
</div>

<div id="appPage" style="display:none">

<div class="chat-box" id="chat"></div>

<input id="product" placeholder="Product">
<input id="audience" placeholder="Audience">

<select id="platform">
<option>Instagram</option>
<option>Facebook Ads</option>
<option>Google Ads</option>
<option>YouTube Shorts</option>
<option>YouTube Long</option>
</select>

<button onclick="generate()">Generate</button>
<button onclick="copyText()">Copy</button>
<button onclick="downloadPDF()">PDF</button>
<button onclick="logout()">Logout</button>

</div>

</div>

<script>

let lastResponse = "";

// PAGE SWITCH
function showSignup(){ signupPage.style.display="block"; loginPage.style.display="none"; appPage.style.display="none"; }
function showLogin(){ signupPage.style.display="none"; loginPage.style.display="block"; appPage.style.display="none"; }
function showApp(){ signupPage.style.display="none"; loginPage.style.display="none"; appPage.style.display="block"; }

// SIGNUP
async function signup(){
    const res = await fetch("/signup",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
            username:signupUsername.value,
            password:signupPassword.value,
            confirm_password:confirmPassword.value
        })
    });
    const d = await res.json();
    alert(d.message || d.error);
}

// LOGIN
async function login(){
    const res = await fetch("/login",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
            username:loginUsername.value,
            password:loginPassword.value
        })
    });

    const d = await res.json();

    if(d.token){
        localStorage.setItem("token", d.token);
        showApp();
    } else {
        alert(d.error);
    }
}

// 🔥 FINAL FORMAT FUNCTION
function formatToCards(text){

    text = text.replace(/\*\*/g, "").replace(/#/g, "");

    const sections = {
        "Strategy": [],
        "Growth Plan": [],
        "Do's & Don'ts": {do:[], dont:[]},
        "Captions": [],
        "Hashtags": [],
        "CTA": []
    };

    let current = "";
    let mode = "";

    text.split("\n").forEach(line => {

        let l = line.trim().toLowerCase();

        if(l.includes("strategy")) current="Strategy";
        else if(l.includes("growth")) current="Growth Plan";
        else if(l.includes("do") && l.includes("don't")) current="Do's & Don'ts";
        else if(l.includes("caption")) current="Captions";
        else if(l.includes("hashtag")) current="Hashtags";
        else if(l.includes("cta")) current="CTA";

        else if(current === "Do's & Don'ts"){

            if(l.includes("do")) mode="do";
            else if(l.includes("don't")) mode="dont";
            else if(mode && line.trim()){
                sections[current][mode].push(line.trim());
            }

        }
        else if(current && line.trim()){

            // 🔥 Hashtag fix
            if(current === "Hashtags"){
                let tag = line.replace(/[-•]/g,"").trim();
                if(tag && !tag.startsWith("#")) tag = "#"+tag;
                sections[current].push(tag);
            }else{
                sections[current].push(line.trim());
            }
        }

    });

    let html = "";

    // Strategy / Growth / Captions / CTA
    ["Strategy","Growth Plan","Captions","CTA"].forEach(title=>{
        if(sections[title].length){
            html += `<div class="card"><h3>${title}</h3>`;
            sections[title].forEach(i=> html+=`<p>• ${i}</p>`);
            html += `</div>`;
        }
    });

    // Do & Don't
    if(sections["Do's & Don'ts"].do.length || sections["Do's & Don'ts"].dont.length){
        html += `<div class="card"><h3>Do's & Don'ts</h3>`;

        if(sections["Do's & Don'ts"].do.length){
            html += `<p><b>✅ Do:</b></p>`;
            sections["Do's & Don'ts"].do.forEach(i=> html+=`<p>• ${i}</p>`);
        }

        if(sections["Do's & Don'ts"].dont.length){
            html += `<p><b>❌ Don't:</b></p>`;
            sections["Do's & Don'ts"].dont.forEach(i=> html+=`<p>• ${i}</p>`);
        }

        html += `</div>`;
    }

    // Hashtags
    if(sections["Hashtags"].length){
        html += `<div class="card"><h3>Hashtags</h3>`;
        sections["Hashtags"].forEach(i=> html+=`<p>${i}</p>`);
        html += `</div>`;
    }

    return html;
}

// GENERATE
async function generate(){

    const token = localStorage.getItem("token");

    chat.innerHTML = `<div class="loader">🤖 AI is thinking...</div>`;

    await new Promise(r => setTimeout(r, 800));

    const res = await fetch("/generate",{
        method:"POST",
        headers:{
            "Content-Type":"application/json",
            "Authorization":"Bearer "+token
        },
        body:JSON.stringify({
            product:product.value,
            audience:audience.value,
            platform:platform.value
        })
    });

    const d = await res.json();

    chat.innerHTML = "";

    if(d.campaign){
        lastResponse = d.campaign;
        chat.innerHTML = formatToCards(d.campaign);
    }else{
        chat.innerHTML = "<p style='color:red'>❌ Error</p>";
    }
}

// COPY
function copyText(){
    navigator.clipboard.writeText(lastResponse);
    alert("Copied!");
}

// PDF
function downloadPDF(){

    const element = document.createElement("div");

    element.innerHTML = `
        <div style="padding:20px;font-family:Arial;">
            <h2>AI Marketing Plan</h2>
            <pre style="white-space:pre-wrap;">${lastResponse}</pre>
        </div>
    `;

    document.body.appendChild(element);

    html2pdf().from(element).save("marketing-plan.pdf")
    .then(()=>document.body.removeChild(element));
}

// LOGOUT
function logout(){
    localStorage.removeItem("token");
    location.reload();
}

// AUTO LOAD
window.onload = ()=>{
    const token = localStorage.getItem("token");
    if(token) showApp();
    else showSignup();
}

</script>

</body>
</html>
