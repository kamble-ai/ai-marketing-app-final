<!DOCTYPE html>
<html>
<head>
<title>AI Marketing Generator</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    font-family: 'Segoe UI';
    background:#0f172a;
    color:white;
    text-align:center;
    margin:0;
    padding:10px;
}

/* MAIN BOX */
.box {
    background:white;
    color:black;
    padding:20px;
    border-radius:12px;
    width:100%;
    max-width:900px;
    margin:10px auto;
}

/* CHAT */
.chat-box {
    background:#020617;
    padding:15px;
    border-radius:12px;
    margin-bottom:15px;
    overflow:hidden;
}

/* CARD */
.card {
    background:#1e293b;
    padding:15px;
    margin:12px 0;
    border-radius:12px;
    text-align:left;
    width:100%;
}

.card h3 {
    color:#22c55e;
    margin-bottom:8px;
}

.card p {
    color:#e2e8f0;
    line-height:1.6;
    font-size:15px;
    word-break:break-word;
}

/* LOADER */
.loader {
    color:#22c55e;
    font-size:18px;
    animation: blink 1s infinite;
}
@keyframes blink {
    0%{opacity:0.3}
    50%{opacity:1}
    100%{opacity:0.3}
}

/* INPUTS */
input,select {
    width:100%;
    padding:12px;
    margin:8px 0;
    border-radius:8px;
    border:1px solid #ccc;
    font-size:14px;
}

/* BUTTONS CONTAINER */
.btn-group {
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:10px;
}

/* BUTTON */
button {
    padding:10px 14px;
    background:green;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
    flex:1 1 120px;
}

/* LINKS */
p[onclick] {
    color:#2563eb;
    font-size:14px;
}

/* MOBILE OPTIMIZATION */
@media (max-width:600px){

    body {
        padding:5px;
    }

    .box {
        padding:15px;
        border-radius:10px;
    }

    .chat-box {
        padding:10px;
    }

    .card {
        padding:12px;
    }

    .card p {
        font-size:14px;
    }

    h2 {
        font-size:18px;
    }

    button {
        font-size:13px;
        padding:10px;
    }

}

</style>
</head>

<body>

<h2>🚀 AI Marketing Generator</h2>

<div class="box">

<div id="signupPage">
<h3>Signup</h3>
<input id="signupUsername" placeholder="Username">
<input id="signupPassword" type="password" placeholder="Password">
<input id="confirmPassword" type="password" placeholder="Confirm Password">
<button onclick="signup()">Signup</button>
<p onclick="showLogin()" style="cursor:pointer">Login</p>
</div>

<div id="loginPage" style="display:none">
<h3>Login</h3>
<input id="loginUsername" placeholder="Username">
<input id="loginPassword" type="password" placeholder="Password">
<button onclick="login()">Login</button>
<p onclick="showSignup()" style="cursor:pointer">Signup</p>
</div>

<div id="appPage" style="display:none">

<div id="chat" class="chat-box"></div>

<input id="product" placeholder="Product">
<input id="audience" placeholder="Audience">

<select id="platform">
<option>Instagram</option>
<option>Facebook Ads</option>
<option>Google Ads</option>
<option>YouTube Shorts</option>
<option>YouTube Long</option>
</select>

<div class="btn-group">
<button onclick="generate()">Generate</button>
<button onclick="copyText()">Copy</button>
<button onclick="downloadPDF()">PDF</button>
<button onclick="logout()">Logout</button>
</div>

</div>
</div>

<script>

let lastResponse = "";

// ================= PAGE SWITCH
function showSignup(){ signupPage.style.display="block"; loginPage.style.display="none"; appPage.style.display="none"; }
function showLogin(){ signupPage.style.display="none"; loginPage.style.display="block"; appPage.style.display="none"; }
function showApp(){ signupPage.style.display="none"; loginPage.style.display="none"; appPage.style.display="block"; }

// ================= SIGNUP
async function signup(){
    const res = await fetch("/signup",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
            username:signupUsername.value,
            password:signupPassword.value,
            confirm_password:confirmPassword.value
        })
    });
    const d = await res.json();
    alert(d.message || d.error);
}

// ================= LOGIN
async function login(){
    const res = await fetch("/login",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
            username:loginUsername.value,
            password:loginPassword.value
        })
    });

    const d = await res.json();

    if(d.token){
        localStorage.setItem("token", d.token);
        showApp();
    } else {
        alert(d.error);
    }
}

// ================= FORMAT (UNCHANGED)
function formatToCards(text){

    text = text.replace(/\*/g,"");

    const sections = {
        strategy: [],
        growth: [],
        do: [],
        dont: [],
        captions: [],
        hashtags: [],
        cta: []
    };

    let current = "";

    text.split("\n").forEach(line => {

        let l = line.trim();
        if(!l) return;

        let lower = l.toLowerCase();

        if(lower.includes("strategy")) { current="strategy"; return; }
        if(lower.includes("growth")) { current="growth"; return; }
        if(lower.includes("do's") || lower === "do") { current="do"; return; }
        if(lower.includes("don't")) { current="dont"; return; }
        if(lower.includes("captions")) { current="captions"; return; }
        if(lower.includes("hashtag")) { current="hashtags"; return; }
        if(lower.includes("cta") || lower.includes("call to action")) { current="cta"; return; }

        if(current === "hashtags"){
            let tags = l.match(/#\w+/g);
            if(tags){
                sections.hashtags.push(...tags);
            }
            return;
        }

        if(current){
            sections[current].push(l);
        }

    });

    function createCard(title, arr){
        if(!arr.length) return "";
        return `<div class="card">
            <h3>${title}</h3>
            ${arr.map(i=>`<p>• ${i}</p>`).join("")}
        </div>`;
    }

    let html = "";

    html += createCard("Strategy", sections.strategy);
    html += createCard("Growth Plan", sections.growth);
    html += createCard("✅ Do", sections.do);
    html += createCard("❌ Don't", sections.dont);
    html += createCard("Captions", sections.captions);

    if(sections.hashtags.length){
        html += `<div class="card"><h3>Hashtags</h3>`;
        sections.hashtags.forEach(i=> html+=`<p>${i}</p>`);
        html += `</div>`;
    }

    html += createCard("CTA", sections.cta);

    return html;
}

// ================= GENERATE
async function generate(){

    const token = localStorage.getItem("token");

    chat.innerHTML = `<div class="loader">🤖 AI is thinking...</div>`;

    const res = await fetch("/generate",{
        method:"POST",
        headers:{
            "Content-Type":"application/json",
            "Authorization":"Bearer "+token
        },
        body:JSON.stringify({
            product:product.value,
            audience:audience.value,
            platform:platform.value
        })
    });

    const d = await res.json();

    chat.innerHTML = "";

    if(d.campaign){
        lastResponse = d.campaign;
        chat.innerHTML = formatToCards(d.campaign);
    }else{
        chat.innerHTML = "<p style='color:red'>❌ Error</p>";
    }
}

// ================= COPY
function copyText(){
    navigator.clipboard.writeText(lastResponse);
    alert("Copied!");
}

// ================= PDF
function downloadPDF(){
    const el = document.createElement("div");
    el.innerHTML = `<pre>${lastResponse}</pre>`;
    document.body.appendChild(el);
    html2pdf().from(el).save("plan.pdf")
    .then(()=>document.body.removeChild(el));
}

// ================= LOGOUT
function logout(){
    localStorage.removeItem("token");
    location.reload();
}

// ================= AUTO LOAD
window.onload = ()=>{
    const token = localStorage.getItem("token");
    if(token) showApp();
    else showSignup();
}

</script>

</body>
</html>
