<!DOCTYPE html>
<html>
<head>
<title>AI Marketing Generator</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>

/* BACKGROUND */
body {
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg,#020617,#0f172a);
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

/* GLASS CARD */
.box {
    width:500px;
    backdrop-filter: blur(20px);
    background: rgba(255,255,255,0.08);
    border-radius:16px;
    padding:20px;
    box-shadow:0 10px 40px rgba(0,0,0,0.5);
}

/* TITLE */
h2 {
    text-align:center;
    margin-bottom:15px;
}

/* CHAT */
.chat-box {
    background: rgba(0,0,0,0.6);
    border-radius:12px;
    padding:15px;
    height:260px;
    overflow-y:auto;
    margin-bottom:10px;
}

/* MESSAGES */
.msg {
    padding:10px;
    margin:8px;
    border-radius:10px;
    max-width:80%;
    line-height:1.5;
}

.user {
    background:#16a34a;
    align-self:flex-end;
}

.ai {
    background:#1e293b;
}

/* INPUT */
input,select {
    width:100%;
    padding:10px;
    margin:8px 0;
    border-radius:8px;
    border:none;
}

/* BUTTONS */
button {
    padding:10px;
    border:none;
    border-radius:8px;
    margin:5px;
    cursor:pointer;
    font-weight:bold;
}

.generate-btn { background:#16a34a; color:white; }
.copy-btn { background:#2563eb; color:white; }
.pdf-btn { background:#9333ea; color:white; }
.logout-btn { background:#dc2626; color:white; }

/* TYPING */
.typing {
    font-style:italic;
    opacity:0.7;
}

/* FORMATTED OUTPUT */
.formatted h3 {
    text-align:center;
    margin-top:10px;
}

.formatted p {
    margin:6px 0;
}

.divider {
    border-top:1px solid #475569;
    margin:10px 0;
}

</style>
</head>

<body>

<div class="box">

<h2>🚀 AI Marketing Generator</h2>

<div id="chat" class="chat-box"></div>

<input id="product" placeholder="Product">
<input id="audience" placeholder="Audience">

<select id="platform">
<option>Instagram</option>
<option>Facebook Ads</option>
<option>Google Ads</option>
<option>YouTube Shorts</option>
<option>YouTube Long</option>
</select>

<button class="generate-btn" onclick="generate()">Generate</button>
<button class="copy-btn" onclick="copyText()">Copy</button>
<button class="pdf-btn" onclick="downloadPDF()">PDF</button>
<button class="logout-btn" onclick="logout()">Logout</button>

</div>

<script>

let lastResponse = "";

/* FORMAT OUTPUT */
function formatResponse(text){

    text = text.replace(/\*\*/g,"");

    const lines = text.split("\n").filter(l=>l.trim()!="");

    let html = "<div class='formatted'>";
    let section = 1;
    let sub = 0;

    lines.forEach(line=>{

        if(line.includes("Strategy") ||
           line.includes("Growth") ||
           line.includes("Do") ||
           line.includes("Caption") ||
           line.includes("Hashtag") ||
           line.includes("CTA")){

            sub=0;

            html += `<h3>${section}. ${line}</h3><div class='divider'></div>`;
            section++;

        } else {

            const letter = String.fromCharCode(97 + sub);
            html += `<p><b>${letter}.</b> ${line}</p>`;
            sub++;
        }

    });

    html += "</div>";
    return html;
}

/* ADD MESSAGE */
function addMessage(text,type,isHTML=false){

    const chat=document.getElementById("chat");

    const div=document.createElement("div");
    div.className="msg "+type;

    if(isHTML) div.innerHTML=text;
    else div.innerText=text;

    chat.appendChild(div);
    chat.scrollTop=chat.scrollHeight;
}

/* GENERATE */
async function generate(){

    const token = localStorage.getItem("token");

    addMessage("⏳ AI is thinking...","ai");

    const res = await fetch("/generate",{
        method:"POST",
        headers:{
            "Content-Type":"application/json",
            "Authorization":"Bearer "+token
        },
        body:JSON.stringify({
            product:product.value,
            audience:audience.value,
            platform:platform.value
        })
    });

    const d = await res.json();

    document.querySelectorAll(".ai").forEach(el=>{
        if(el.innerText.includes("thinking")) el.remove();
    });

    if(d.campaign){
        lastResponse=d.campaign;
        addMessage(formatResponse(d.campaign),"ai",true);
    } else {
        addMessage("❌ Error","ai");
    }
}

/* COPY */
function copyText(){
    navigator.clipboard.writeText(lastResponse);
    alert("Copied!");
}

/* PDF */
function downloadPDF(){

    const element=document.createElement("div");
    element.innerHTML=formatResponse(lastResponse);
    document.body.appendChild(element);

    html2pdf().from(element).save("marketing-plan.pdf");

    setTimeout(()=>document.body.removeChild(element),1000);
}

/* LOGOUT */
function logout(){
    localStorage.removeItem("token");
    location.reload();
}

</script>

</body>
</html>
