<!DOCTYPE html>
<html>
<head>
<title>AI Marketing Generator</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>
body {
    font-family: 'Segoe UI';
    background:#0f172a;
    color:white;
    text-align:center;
}

/* MAIN BOX */
.box {
    background:white;
    color:black;
    padding:20px;
    border-radius:10px;
    max-width:600px;
    margin:auto;
}

/* CHAT BOX (FIXED) */
.chat-box {
    background:#020617;
    color:white;
    padding:15px;
    border-radius:10px;
    margin-bottom:10px;

    /* 🔥 FIX */
    min-height:150px;
    overflow:visible;
    display:flex;
    flex-direction:column;
}

/* MESSAGE */
.msg {
    margin:10px;
    padding:10px;
    border-radius:8px;

    /* 🔥 IMPORTANT */
    white-space:pre-wrap;
    word-wrap:break-word;
}

.user { color:lightgreen; }
.ai { color:white; }

/* INPUT */
input,select {
    width:90%;
    padding:10px;
    margin:10px;
}

/* BUTTON */
button {
    padding:10px;
    margin:5px;
    background:green;
    color:white;
    border:none;
    cursor:pointer;
}

/* 🔥 TYPING DOTS */
.typing::after {
    content: '...';
    animation: blink 1s infinite;
}

@keyframes blink {
    0% { opacity:0 }
    50% { opacity:1 }
    100% { opacity:0 }
}
</style>
</head>

<body>

<h2>🚀 AI Marketing Generator</h2>

<div class="box">

<!-- SIGNUP -->
<div id="signupPage">
<h3>Signup</h3>
<input id="signupUsername" placeholder="Username">
<input id="signupPassword" type="password">
<input id="confirmPassword" type="password">
<button onclick="signup()">Signup</button>
<p onclick="showLogin()" style="cursor:pointer;color:blue">Login</p>
</div>

<!-- LOGIN -->
<div id="loginPage" style="display:none">
<h3>Login</h3>
<input id="loginUsername">
<input id="loginPassword" type="password">
<button onclick="login()">Login</button>
<p onclick="showSignup()" style="cursor:pointer;color:blue">Signup</p>
</div>

<!-- APP -->
<div id="appPage" style="display:none">

<div class="chat-box" id="chat"></div>

<input id="product" placeholder="Product">
<input id="audience" placeholder="Audience">

<select id="platform">
<option>Instagram</option>
<option>Facebook Ads</option>
<option>Google Ads</option>
<option>YouTube Shorts</option>
<option>YouTube Long</option>
</select>

<button onclick="generate()">Generate</button>
<button onclick="copyText()">Copy</button>
<button onclick="downloadPDF()">PDF</button>
<button onclick="logout()">Logout</button>

</div>

</div>

<script>

let lastResponse = "";

// PAGE SWITCH
function showSignup(){
    signupPage.style.display="block";
    loginPage.style.display="none";
    appPage.style.display="none";
}
function showLogin(){
    signupPage.style.display="none";
    loginPage.style.display="block";
    appPage.style.display="none";
}
function showApp(){
    signupPage.style.display="none";
    loginPage.style.display="none";
    appPage.style.display="block";
}

// SIGNUP
async function signup(){
    const res = await fetch("/signup",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
            username:signupUsername.value,
            password:signupPassword.value,
            confirm_password:confirmPassword.value
        })
    });
    const d = await res.json();
    alert(d.message || d.error);
}

// LOGIN
async function login(){
    const res = await fetch("/login",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
            username:loginUsername.value,
            password:loginPassword.value
        })
    });

    const d = await res.json();

    if(d.token){
        localStorage.setItem("token", d.token);
        showApp();
    } else {
        alert(d.error);
    }
}

// ADD MESSAGE
function addMessage(text, type, className=""){
    const div = document.createElement("div");
    div.className="msg "+type+" "+className;
    div.innerText=text;
    chat.appendChild(div);
    return div;
}

// TYPEWRITER
function typeWriter(element, text, speed=15){
    let i = 0;
    element.innerText = "";

    function typing(){
        if(i < text.length){
            element.innerText += text.charAt(i);
            i++;
            setTimeout(typing, speed);
        }
    }

    typing();
}

// GENERATE (FIXED)
async function generate(){

    const token = localStorage.getItem("token");

    if(!token){
        alert("Please login first");
        return;
    }

    // 🔥 CLEAR OLD DATA
    chat.innerHTML = "";

    const loading = addMessage("AI is thinking", "ai", "typing");

    try{
        const res = await fetch("/generate",{
            method:"POST",
            headers:{
                "Content-Type":"application/json",
                "Authorization":"Bearer "+token
            },
            body:JSON.stringify({
                product:product.value,
                audience:audience.value,
                platform:platform.value
            })
        });

        const d = await res.json();

        loading.remove();

        if(d.campaign){
            lastResponse = d.campaign;

            const msg = addMessage("", "ai");
            typeWriter(msg, d.campaign);
        } else {
            addMessage("❌ Error","ai");
        }

    }catch(err){
        loading.remove();
        addMessage("❌ Server error","ai");
    }
}

// COPY
function copyText(){
    navigator.clipboard.writeText(lastResponse);
    alert("Copied!");
}

// PDF
function downloadPDF(){

    if(!lastResponse){
        alert("Generate content first");
        return;
    }

    const element = document.createElement("div");

    element.style.position = "fixed";
    element.style.left = "-9999px";
    element.style.width = "800px";
    element.style.background = "white";
    element.style.color = "black";
    element.style.padding = "20px";

    element.innerHTML = `
        <h2 style="text-align:center;">AI Marketing Plan</h2>
        <div style="white-space: pre-wrap;">
            ${lastResponse}
        </div>
    `;

    document.body.appendChild(element);

    setTimeout(() => {
        html2pdf().from(element).save("marketing-plan.pdf")
        .then(()=> document.body.removeChild(element));
    }, 300);
}

// LOGOUT
function logout(){
    localStorage.removeItem("token");
    location.reload();
}

// AUTO LOAD
window.onload = ()=>{
    const token = localStorage.getItem("token");
    if(token) showApp();
    else showSignup();
}

</script>

</body>
</html>
