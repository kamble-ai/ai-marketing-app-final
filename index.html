<!DOCTYPE html>
<html>
<head>
<title>AI Marketing Generator</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>
body {
    font-family: 'Segoe UI';
    background:#0f172a;
    color:white;
    text-align:center;
}

.box {
    background:white;
    color:black;
    padding:20px;
    border-radius:12px;
    max-width:900px;
    margin:auto;
}

.chat-box {
    background:#020617;
    padding:20px;
    border-radius:12px;
    margin-bottom:15px;
}

/* CARD */
.card {
    background:#1e293b;
    padding:18px;
    margin:15px 0;
    border-radius:12px;
    text-align:left;
}

.card h3 {
    color:#22c55e;
}

.card p {
    color:#f1f5f9;
    line-height:1.7;
    font-size:14px;
}

/* LOADER */
.loader {
    color:#22c55e;
    font-size:18px;
    animation: blink 1s infinite;
}
@keyframes blink {
    0%{opacity:0.3}
    50%{opacity:1}
    100%{opacity:0.3}
}

input,select {
    width:90%;
    padding:10px;
    margin:10px;
}

button {
    padding:10px;
    margin:5px;
    background:green;
    color:white;
    border:none;
    cursor:pointer;
}
</style>
</head>

<body>

<h2>🚀 AI Marketing Generator</h2>

<div class="box">

<div id="signupPage">
<h3>Signup</h3>
<input id="signupUsername">
<input id="signupPassword" type="password">
<input id="confirmPassword" type="password">
<button onclick="signup()">Signup</button>
<p onclick="showLogin()" style="cursor:pointer;color:blue">Login</p>
</div>

<div id="loginPage" style="display:none">
<h3>Login</h3>
<input id="loginUsername">
<input id="loginPassword" type="password">
<button onclick="login()">Login</button>
<p onclick="showSignup()" style="cursor:pointer;color:blue">Signup</p>
</div>

<div id="appPage" style="display:none">

<div id="chat" class="chat-box"></div>

<input id="product" placeholder="Product">
<input id="audience" placeholder="Audience">

<select id="platform">
<option>Instagram</option>
<option>Facebook Ads</option>
<option>Google Ads</option>
<option>YouTube Shorts</option>
<option>YouTube Long</option>
</select>

<button onclick="generate()">Generate</button>
<button onclick="copyText()">Copy</button>
<button onclick="downloadPDF()">PDF</button>
<button onclick="logout()">Logout</button>

</div>
</div>

<script>

let lastResponse = "";

// ================= PAGE SWITCH
function showSignup(){ signupPage.style.display="block"; loginPage.style.display="none"; appPage.style.display="none"; }
function showLogin(){ signupPage.style.display="none"; loginPage.style.display="block"; appPage.style.display="none"; }
function showApp(){ signupPage.style.display="none"; loginPage.style.display="none"; appPage.style.display="block"; }

// ================= SIGNUP
async function signup(){
    const res = await fetch("/signup",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
            username:signupUsername.value,
            password:signupPassword.value,
            confirm_password:confirmPassword.value
        })
    });
    const d = await res.json();
    alert(d.message || d.error);
}

// ================= LOGIN
async function login(){
    const res = await fetch("/login",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
            username:loginUsername.value,
            password:loginPassword.value
        })
    });

    const d = await res.json();

    if(d.token){
        localStorage.setItem("token", d.token);
        showApp();
    } else {
        alert(d.error);
    }
}

// ================= 🔥 FINAL PARSER
function formatToCards(text){

    text = text.replace(/\*\*/g,"");

    const sections = {
        strategy: [],
        growth: [],
        do: [],
        dont: [],
        captions: [],
        hashtags: [],
        cta: []
    };

    let current = "";

    text.split("\n").forEach(line => {

        let l = line.trim();

        if(!l) return;

        let lower = l.toLowerCase();

        // SECTION DETECTION
        if(lower.startsWith("1.") || lower.includes("strategy")){
            current = "strategy";
            return;
        }
        if(lower.startsWith("2.") || lower.includes("growth")){
            current = "growth";
            return;
        }
        if(lower.includes("do") && lower.includes("don't")){
            current = "do";
            return;
        }
        if(lower.includes("caption")){
            current = "captions";
            return;
        }
        if(lower.includes("hashtag")){
            current = "hashtags";
            return;
        }
        if(lower.includes("cta")){
            current = "cta";
            return;
        }

        // DO / DON'T SPLIT
        if(current === "do"){
            if(lower.includes("don't")){
                current = "dont";
                return;
            }
            sections.do.push(l);
            return;
        }

        if(current === "dont"){
            sections.dont.push(l);
            return;
        }

        // NORMAL SECTIONS
        if(current === "hashtags"){
            let tag = l.replace(/[-•]/g,"").trim();
            if(!tag.startsWith("#")) tag = "#"+tag;
            sections.hashtags.push(tag);
        } else {
            sections[current]?.push(l);
        }

    });

    let html = "";

    function createCard(title, arr){
        if(!arr.length) return "";
        return `<div class="card">
            <h3>${title}</h3>
            ${arr.map(i=>`<p>• ${i}</p>`).join("")}
        </div>`;
    }

    html += createCard("Strategy", sections.strategy);
    html += createCard("Growth Plan", sections.growth);

    // DO & DON'T
    if(sections.do.length || sections.dont.length){
        html += `<div class="card"><h3>Do's & Don'ts</h3>`;

        if(sections.do.length){
            html += `<p><b>✅ Do:</b></p>`;
            sections.do.forEach(i=> html+=`<p>• ${i}</p>`);
        }

        if(sections.dont.length){
            html += `<p><b>❌ Don't:</b></p>`;
            sections.dont.forEach(i=> html+=`<p>• ${i}</p>`);
        }

        html += `</div>`;
    }

    html += createCard("Captions", sections.captions);

    // HASHTAGS
    if(sections.hashtags.length){
        html += `<div class="card"><h3>Hashtags</h3>`;
        sections.hashtags.forEach(i=> html+=`<p>${i}</p>`);
        html += `</div>`;
    }

    // ✅ CTA FIX
    html += createCard("CTA", sections.cta);

    return html;
}

// ================= GENERATE
async function generate(){

    const token = localStorage.getItem("token");

    chat.innerHTML = `<div class="loader">🤖 AI is thinking...</div>`;

    const res = await fetch("/generate",{
        method:"POST",
        headers:{
            "Content-Type":"application/json",
            "Authorization":"Bearer "+token
        },
        body:JSON.stringify({
            product:product.value,
            audience:audience.value,
            platform:platform.value
        })
    });

    const d = await res.json();

    chat.innerHTML = "";

    if(d.campaign){
        lastResponse = d.campaign;
        chat.innerHTML = formatToCards(d.campaign);
    }else{
        chat.innerHTML = "<p style='color:red'>❌ Error</p>";
    }
}

// ================= COPY
function copyText(){
    navigator.clipboard.writeText(lastResponse);
    alert("Copied!");
}

// ================= PDF
function downloadPDF(){
    const el = document.createElement("div");
    el.innerHTML = `<pre>${lastResponse}</pre>`;
    document.body.appendChild(el);
    html2pdf().from(el).save("plan.pdf")
    .then(()=>document.body.removeChild(el));
}

// ================= LOGOUT
function logout(){
    localStorage.removeItem("token");
    location.reload();
}

// ================= AUTO LOAD
window.onload = ()=>{
    const token = localStorage.getItem("token");
    if(token) showApp();
    else showSignup();
}

</script>

</body>
</html>
