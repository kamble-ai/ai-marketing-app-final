<!DOCTYPE html>
<html>
<head>
<title>AI Marketing Generator</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>
body {
    font-family: 'Segoe UI';
    background:#0f172a;
    color:white;
    text-align:center;
}

.box {
    background:white;
    color:black;
    padding:20px;
    border-radius:10px;
    max-width:500px;
    margin:auto;
}

.chat-box {
    background:#020617;
    color:white;
    height:250px;
    overflow:auto;
    padding:10px;
    border-radius:10px;
    margin-bottom:10px;
}

.msg { margin:10px; }
.user { color:lightgreen; }
.ai { color:white; }

input,select {
    width:90%;
    padding:10px;
    margin:10px;
}

button {
    padding:10px;
    margin:5px;
    background:green;
    color:white;
    border:none;
    cursor:pointer;
}
</style>
</head>

<body>

<h2>🚀 AI Marketing Generator</h2>

<div class="box">

<div id="signupPage">
<h3>Signup</h3>
<input id="signupUsername" placeholder="Username">
<input id="signupPassword" type="password">
<input id="confirmPassword" type="password">
<button onclick="signup()">Signup</button>
<p onclick="showLogin()" style="cursor:pointer;color:blue">Login</p>
</div>

<div id="loginPage" style="display:none">
<h3>Login</h3>
<input id="loginUsername">
<input id="loginPassword" type="password">
<button onclick="login()">Login</button>
<p onclick="showSignup()" style="cursor:pointer;color:blue">Signup</p>
</div>

<div id="appPage" style="display:none">

<div class="chat-box" id="chat"></div>

<input id="product">
<input id="audience">

<select id="platform">
<option>Instagram</option>
<option>Facebook Ads</option>
<option>Google Ads</option>
<option>YouTube Shorts</option>
<option>YouTube Long</option>
</select>

<button onclick="generate()">Generate</button>
<button onclick="copyText()">Copy</button>
<button onclick="downloadPDF()">PDF</button>
<button onclick="logout()">Logout</button>

</div>

</div>

<script>

let lastResponse = "";

// =================== PAGE SWITCH
function showSignup(){
    signupPage.style.display="block";
    loginPage.style.display="none";
    appPage.style.display="none";
}
function showLogin(){
    signupPage.style.display="none";
    loginPage.style.display="block";
    appPage.style.display="none";
}
function showApp(){
    signupPage.style.display="none";
    loginPage.style.display="none";
    appPage.style.display="block";
}

// =================== SIGNUP
async function signup(){
    const res = await fetch("/signup",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
            username:signupUsername.value,
            password:signupPassword.value,
            confirm_password:confirmPassword.value
        })
    });
    const d = await res.json();
    alert(d.message || d.error);
}

// =================== LOGIN
async function login(){
    const res = await fetch("/login",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
            username:loginUsername.value,
            password:loginPassword.value
        })
    });

    const d = await res.json();

    if(d.token){
        localStorage.setItem("token", d.token);
        showApp();
    } else {
        alert(d.error);
    }
}

// =================== ADD MESSAGE
function addMessage(text, type){
    const div = document.createElement("div");
    div.className="msg "+type;
    div.innerText=text;
    chat.appendChild(div);
}

// =================== GENERATE
async function generate(){

    const token = localStorage.getItem("token");

    addMessage("Generating...","ai");

    const res = await fetch("/generate",{
        method:"POST",
        headers:{
            "Content-Type":"application/json",
            "Authorization":"Bearer "+token
        },
        body:JSON.stringify({
            product:product.value,
            audience:audience.value,
            platform:platform.value
        })
    });

    const d = await res.json();

    if(d.campaign){
        lastResponse = d.campaign;
        addMessage(d.campaign,"ai");
    }else{
        addMessage("❌ Error","ai");
    }
}

// =================== COPY
function copyText(){
    navigator.clipboard.writeText(lastResponse);
    alert("Copied!");
}

// =================== ✅ FIXED PDF FUNCTION
function downloadPDF(){

    if(!lastResponse){
        alert("Generate content first");
        return;
    }

    const element = document.createElement("div");

    // 🔥 IMPORTANT: use innerHTML + styling
    element.innerHTML = `
        <div style="padding:20px;font-family:Arial;">
            <h2>AI Marketing Plan</h2>
            <pre style="white-space:pre-wrap;font-size:12px;">
${lastResponse}
            </pre>
        </div>
    `;

    document.body.appendChild(element);

    html2pdf()
        .set({
            margin:10,
            filename:"marketing-plan.pdf",
            html2canvas:{ scale:2 },
            jsPDF:{ unit:"mm", format:"a4", orientation:"portrait" }
        })
        .from(element)
        .save()
        .then(()=>{
            document.body.removeChild(element);
        });
}

// =================== LOGOUT
function logout(){
    localStorage.removeItem("token");
    location.reload();
}

// =================== AUTO LOAD
window.onload = ()=>{
    const token = localStorage.getItem("token");
    if(token) showApp();
    else showSignup();
}

</script>

</body>
</html>
