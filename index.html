<!DOCTYPE html>
<html>
<head>
<title>AI Marketing Generator</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>
body {
    font-family: 'Segoe UI';
    background:#0f172a;
    color:white;
    text-align:center;
}

.box {
    background:white;
    color:black;
    padding:20px;
    border-radius:10px;
    max-width:700px;
    margin:auto;
}

/* CHAT */
.chat-box {
    background:#020617;
    padding:15px;
    border-radius:10px;
    margin-bottom:10px;
}

/* MESSAGE */
.msg {
    margin:10px;
    padding:10px;
    border-radius:8px;
}

/* CARD UI */
.card {
    background:#111827;
    color:white;
    padding:15px;
    border-radius:10px;
    margin:10px 0;
    text-align:left;
}

.card h3 {
    text-align:center;
    color:#22c55e;
}

.card p {
    margin:6px 0;
}

/* INPUT */
input,select {
    width:90%;
    padding:10px;
    margin:10px;
}

/* BUTTON */
button {
    padding:10px;
    margin:5px;
    background:#16a34a;
    color:white;
    border:none;
    cursor:pointer;
}
</style>
</head>

<body>

<h2>🚀 AI Marketing Generator</h2>

<div class="box">

<!-- SIGNUP -->
<div id="signupPage">
<h3>Signup</h3>
<input id="signupUsername" placeholder="Username">
<input id="signupPassword" type="password">
<input id="confirmPassword" type="password">
<button onclick="signup()">Signup</button>
<p onclick="showLogin()" style="cursor:pointer;color:blue">Login</p>
</div>

<!-- LOGIN -->
<div id="loginPage" style="display:none">
<h3>Login</h3>
<input id="loginUsername">
<input id="loginPassword" type="password">
<button onclick="login()">Login</button>
<p onclick="showSignup()" style="cursor:pointer;color:blue">Signup</p>
</div>

<!-- APP -->
<div id="appPage" style="display:none">

<div id="chat" class="chat-box"></div>

<input id="product" placeholder="Product">
<input id="audience" placeholder="Audience">

<select id="platform">
<option>Instagram</option>
<option>Facebook Ads</option>
<option>Google Ads</option>
<option>YouTube Shorts</option>
<option>YouTube Long</option>
</select>

<button onclick="generate()">Generate</button>
<button onclick="copyText()">Copy</button>
<button onclick="downloadPDF()">PDF</button>
<button onclick="logout()">Logout</button>

</div>

</div>

<script>

let lastResponse = "";

// PAGE SWITCH
function showSignup(){
    signupPage.style.display="block";
    loginPage.style.display="none";
    appPage.style.display="none";
}
function showLogin(){
    signupPage.style.display="none";
    loginPage.style.display="block";
    appPage.style.display="none";
}
function showApp(){
    signupPage.style.display="none";
    loginPage.style.display="none";
    appPage.style.display="block";
}

// AUTH
async function signup(){
    const res = await fetch("/signup",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
            username:signupUsername.value,
            password:signupPassword.value,
            confirm_password:confirmPassword.value
        })
    });
    const d = await res.json();
    alert(d.message || d.error);
}

async function login(){
    const res = await fetch("/login",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
            username:loginUsername.value,
            password:loginPassword.value
        })
    });

    const d = await res.json();

    if(d.token){
        localStorage.setItem("token", d.token);
        showApp();
    } else {
        alert(d.error);
    }
}

// 🔥 ADD MESSAGE FIXED
function addMessage(text, type, isHTML=false){
    const div = document.createElement("div");
    div.className = "msg " + type;

    if(isHTML){
        div.innerHTML = text;  // ✅ FIX
    } else {
        div.innerText = text;
    }

    chat.appendChild(div);
}

// 🔥 FORMAT CARDS
function formatToCards(text){

    const sections = text.split(/\d+\./).filter(s=>s.trim());

    const titles = [
        "Strategy",
        "Growth Plan",
        "Do's & Don'ts",
        "Captions",
        "Hashtags",
        "CTA"
    ];

    let html = "";

    sections.forEach((sec,i)=>{
        const lines = sec.trim().split("\n").filter(l=>l.trim());

        html += `<div class="card">`;
        html += `<h3>${titles[i] || "Section"}</h3>`;

        lines.forEach(line=>{
            html += `<p>• ${line}</p>`;
        });

        html += `</div>`;
    });

    return html;
}

// GENERATE
async function generate(){

    const token = localStorage.getItem("token");

    chat.innerHTML = ""; // clear

    addMessage("Generating...","ai");

    const res = await fetch("/generate",{
        method:"POST",
        headers:{
            "Content-Type":"application/json",
            "Authorization":"Bearer "+token
        },
        body:JSON.stringify({
            product:product.value,
            audience:audience.value,
            platform:platform.value
        })
    });

    const d = await res.json();

    chat.innerHTML = "";

    if(d.campaign){
        lastResponse = d.campaign;

        const formatted = formatToCards(d.campaign);
        addMessage(formatted, "ai", true); // 🔥 FIX
    }else{
        addMessage("❌ Error","ai");
    }
}

// COPY
function copyText(){
    navigator.clipboard.writeText(lastResponse);
    alert("Copied!");
}

// PDF
function downloadPDF(){
    const element = document.createElement("div");
    element.innerHTML = formatToCards(lastResponse);

    document.body.appendChild(element);

    setTimeout(()=>{
        html2pdf().from(element).save("marketing-plan.pdf")
        .then(()=>document.body.removeChild(element));
    },300);
}

// LOGOUT
function logout(){
    localStorage.removeItem("token");
    location.reload();
}

// AUTO LOAD
window.onload = ()=>{
    const token = localStorage.getItem("token");
    if(token) showApp();
    else showSignup();
}

</script>

</body>
</html>
