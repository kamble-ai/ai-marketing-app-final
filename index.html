<!DOCTYPE html>
<html>
<head>
<title>AI Marketing Generator</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>
body {
    font-family: 'Segoe UI', sans-serif;
    background:#0f172a;
    color:white;
}

.container {
    max-width:800px;
    margin:auto;
    padding:20px;
}

.chat-box {
    background:#020617;
    border-radius:12px;
    padding:15px;
    height:420px;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
}

.msg {
    max-width:75%;
    padding:12px;
    margin:8px;
    border-radius:10px;
    line-height:1.6;
    white-space:pre-wrap;
}

.user {
    align-self:flex-end;
    background:#16a34a;
}

.ai {
    align-self:flex-start;
    background:#1e293b;
}

.input-box {
    margin-top:10px;
}

input,select {
    width:100%;
    padding:12px;
    margin:8px 0;
    border-radius:8px;
    border:none;
}

button {
    padding:10px;
    border:none;
    border-radius:6px;
    cursor:pointer;
    margin:5px;
}

.generate-btn {
    background:#16a34a;
    color:white;
}

.action-btn {
    background:#2563eb;
    color:white;
}

.toolbar {
    margin-top:10px;
}

/* FORMATTED OUTPUT */
.formatted h2 {
    text-align:center;
    font-weight:bold;
    margin-top:20px;
}

.formatted p {
    margin:8px 0;
}

/* DIVIDER */
.divider {
    border: none;
    border-top: 1px solid #cbd5f5;
    margin: 15px 0 10px;
    opacity: 0.5;
}
</style>
</head>

<body>

<div class="container">

<h2>💬 AI Marketing Generator</h2>

<div id="chat" class="chat-box"></div>

<div class="input-box">

<input id="product" placeholder="Enter Product">
<input id="audience" placeholder="Enter Audience">

<select id="platform">
<option>Instagram</option>
<option>Facebook Ads</option>
<option>Google Ads</option>
<option>YouTube Shorts</option>
<option>YouTube Long</option>
</select>

<button class="generate-btn" onclick="generate()">Generate</button>

</div>

<div class="toolbar">
<button class="action-btn" onclick="copyText()">📋 Copy</button>
<button class="action-btn" onclick="shareText()">🔗 Share</button>
<button class="action-btn" onclick="downloadPDF()">📄 PDF</button>
</div>

</div>

<script>

let lastResponse = "";

// 🔥 FORMAT CLEAN OUTPUT
function formatResponse(text){

    text = text.replace(/\*\*/g, "").replace(/\*/g, "");

    const lines = text.split("\n").filter(l => l.trim() !== "");

    let html = "<div class='formatted'>";
    let section = 1;
    let sub = 0;

    lines.forEach(line => {

        line = line.trim();

        if(
            line.toLowerCase().includes("strategy") ||
            line.toLowerCase().includes("growth") ||
            line.toLowerCase().includes("plan") ||
            line.toLowerCase().includes("do") ||
            line.toLowerCase().includes("don't") ||
            line.toLowerCase().includes("caption") ||
            line.toLowerCase().includes("hashtag")
        ){
            sub = 0;

            html += `
                <h2>${section}. ${line}</h2>
                <hr class="divider">
            `;

            section++;
        }
        else{

            const letter = String.fromCharCode(97 + sub);

            html += `<p><b>${letter}.</b> ${line}</p>`;
            sub++;
        }

    });

    html += "</div>";
    return html;
}

// ADD MESSAGE
function addMessage(text, type, isHTML=false){

    const chat = document.getElementById("chat");

    const div = document.createElement("div");
    div.className = "msg " + type;

    if(isHTML){
        div.innerHTML = text;
    } else {
        div.innerText = text;
    }

    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
}

// GENERATE
async function generate(){

    const productVal = product.value;
    const audienceVal = audience.value;
    const platformVal = platform.value;

    if(!productVal || !audienceVal){
        alert("Fill all fields");
        return;
    }

    addMessage(`Product: ${productVal}\nAudience: ${audienceVal}\nPlatform: ${platformVal}`, "user");

    addMessage("⏳ Generating...", "ai");

    try{
        const res = await fetch("/generate",{
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                product:productVal,
                audience:audienceVal,
                platform:platformVal
            })
        });

        const d = await res.json();

        document.querySelectorAll(".ai").forEach(el=>{
            if(el.innerText==="⏳ Generating...") el.remove();
        });

        if(d.campaign){
            lastResponse = d.campaign;
            addMessage(formatResponse(d.campaign), "ai", true);
        } else {
            addMessage("❌ Error generating", "ai");
        }

    }catch(err){
        addMessage("❌ Server error", "ai");
    }
}

// COPY
function copyText(){
    if(!lastResponse){
        alert("Generate first");
        return;
    }

    navigator.clipboard.writeText(lastResponse);
    alert("Copied!");
}

// SHARE
function shareText(){
    if(!lastResponse){
        alert("Generate first");
        return;
    }

    const text = encodeURIComponent(lastResponse);
    window.open(`https://wa.me/?text=${text}`, "_blank");
}

// PDF
function downloadPDF(){

    if(!lastResponse){
        alert("Generate first");
        return;
    }

    const element = document.createElement("div");
    element.innerHTML = formatResponse(lastResponse);

    html2pdf().from(element).save("marketing-plan.pdf");
}

</script>

</body>
</html>
