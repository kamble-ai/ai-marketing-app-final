<!DOCTYPE html>
<html>
<head>
<title>AI Marketing Generator</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>
body {
    font-family: 'Segoe UI', sans-serif;
    background:#0f172a;
    color:white;
}

.container {
    max-width:800px;
    margin:auto;
    padding:20px;
}

.chat-box {
    background:#020617;
    border-radius:12px;
    padding:15px;
    height:400px;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
}

.msg {
    max-width:75%;
    padding:12px;
    margin:8px;
    border-radius:10px;
    line-height:1.5;
    white-space:pre-wrap;
}

.user {
    align-self:flex-end;
    background:#16a34a;
}

.ai {
    align-self:flex-start;
    background:#1e293b;
}

input,select {
    width:100%;
    padding:12px;
    margin:8px 0;
    border-radius:8px;
    border:none;
}

button {
    padding:10px;
    border:none;
    border-radius:6px;
    cursor:pointer;
    margin:5px;
}

.generate-btn { background:#16a34a; color:white; }
.action-btn { background:#2563eb; color:white; }

.toolbar { margin-top:10px; }
</style>
</head>

<body>

<div class="container">

<h2>💬 AI Marketing Generator</h2>

<div id="chat" class="chat-box"></div>

<input id="product" placeholder="Enter Product">
<input id="audience" placeholder="Enter Audience">

<select id="platform">
<option>Instagram</option>
<option>Facebook Ads</option>
<option>Google Ads</option>
<option>YouTube Shorts</option>
<option>YouTube Long</option>
</select>

<button class="generate-btn" onclick="generate()">Generate</button>

<div class="toolbar">
<button class="action-btn" onclick="copyText()">📋 Copy</button>
<button class="action-btn" onclick="shareText()">🔗 Share</button>
<button class="action-btn" onclick="downloadPDF()">📄 PDF</button>
</div>

</div>

<script>

let lastResponse = "";

// ADD MESSAGE
function addMessage(text, type){
    const chat = document.getElementById("chat");

    const div = document.createElement("div");
    div.className = "msg " + type;
    div.innerText = text;

    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
}

// GENERATE
async function generate(){

    const token = localStorage.getItem("token"); // 🔥 FIX

    if(!token){
        alert("Login required");
        return;
    }

    const productVal = product.value;
    const audienceVal = audience.value;
    const platformVal = platform.value;

    addMessage(`Product: ${productVal}\nAudience: ${audienceVal}\nPlatform: ${platformVal}`, "user");

    addMessage("⏳ Generating...", "ai");

    try{
        const res = await fetch("/generate",{
            method:"POST",
            headers:{
                "Content-Type":"application/json",
                "Authorization": "Bearer " + token   // 🔥 FIX
            },
            body:JSON.stringify({
                product:productVal,
                audience:audienceVal,
                platform:platformVal
            })
        });

        const d = await res.json();

        document.querySelectorAll(".ai").forEach(el=>{
            if(el.innerText==="⏳ Generating...") el.remove();
        });

        console.log("API:", d);

        if(d.campaign){
            lastResponse = d.campaign;
            addMessage(d.campaign, "ai");
        } 
        else if(d.error){
            addMessage("❌ " + d.error, "ai");
        }
        else if(d.detail){
            addMessage("❌ " + d.detail, "ai");
        }
        else{
            addMessage("❌ Unknown error", "ai");
        }

    }catch(err){
        console.log(err);
        addMessage("❌ Server error", "ai");
    }
}

// COPY
function copyText(){
    if(!lastResponse) return alert("Generate first");
    navigator.clipboard.writeText(lastResponse);
    alert("Copied!");
}

// SHARE
function shareText(){
    if(!lastResponse) return alert("Generate first");
    window.open(`https://wa.me/?text=${encodeURIComponent(lastResponse)}`);
}

// PDF
function downloadPDF(){
    if(!lastResponse) return alert("Generate first");

    const element = document.createElement("div");
    element.innerText = lastResponse;

    html2pdf().from(element).save("marketing-plan.pdf");
}

</script>

</body>
</html>
