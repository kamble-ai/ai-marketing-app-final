<!DOCTYPE html>
<html>
<head>
<title>AI Marketing Generator</title>

<style>
body {
    font-family: 'Segoe UI';
    background:#0f172a;
    color:white;
    text-align:center;
}

/* CARD */
.box {
    background:white;
    color:black;
    padding:30px;
    border-radius:14px;
    max-width:700px;
    margin:20px auto;
}

/* INPUT */
input, select {
    width:90%;
    padding:12px;
    margin:10px;
    border-radius:8px;
    border:2px solid #ccc;
    outline:none;
    transition:0.3s;
}

input:focus {
    border-color:#22c55e;
    box-shadow:0 0 10px #22c55e;
}

/* BUTTON */
button {
    padding:12px 18px;
    margin:10px;
    background:#22c55e;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

.hidden {
    display:none;
}
</style>

</head>

<body>

<h2>🚀 AI Marketing Generator</h2>

<!-- LOGIN -->
<div id="loginPage" class="box">
<h3>Login</h3>
<input id="loginUsername" placeholder="Username">
<input id="loginPassword" type="password" placeholder="Password">
<button onclick="login()">Login</button>
<p id="loginMsg"></p>
</div>

<!-- MAIN APP -->
<div id="appPage" class="hidden">

<div class="box">
<h3>Welcome 🎉</h3>
<button onclick="logout()">Logout</button>
</div>

<div class="box">
<h3>Generate Marketing Plan</h3>

<input id="product" placeholder="Product (e.g. Gym Membership)">
<input id="audience" placeholder="Target Audience">
<select id="platform">
<option>Instagram</option>
<option>LinkedIn</option>
<option>YouTube</option>
</select>

<button onclick="generate()">Generate</button>
</div>

<div id="result" class="box hidden"></div>

</div>

<script>

// ✅ CHECK LOGIN ON LOAD
window.onload = function(){
    const token = localStorage.getItem("token");

    if(token){
        showApp();
    } else {
        showLogin();
    }
}

// SHOW LOGIN
function showLogin(){
    loginPage.classList.remove("hidden");
    appPage.classList.add("hidden");
}

// SHOW APP
function showApp(){
    loginPage.classList.add("hidden");
    appPage.classList.remove("hidden");
}

// LOGIN
async function login(){

    const username = loginUsername.value;
    const password = loginPassword.value;

    if(!username || !password){
        loginMsg.innerText = "Enter details";
        return;
    }

    loginMsg.innerText = "Logging in...";

    try {
        const res = await fetch("/login",{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({username,password})
        });

        const data = await res.json();

        if(data.token){
            localStorage.setItem("token", data.token);
            showApp(); // ✅ DIRECT SWITCH (NO RELOAD)
        } else {
            loginMsg.innerText = "Invalid login";
        }

    } catch(err){
        loginMsg.innerText = "Server error";
        console.log(err);
    }
}

// LOGOUT
function logout(){
    localStorage.removeItem("token");
    showLogin();
}

// GENERATE
async function generate(){

    const product = document.getElementById("product").value;
    const audience = document.getElementById("audience").value;
    const platform = document.getElementById("platform").value;

    result.classList.remove("hidden");
    result.innerHTML = "🤖 AI is thinking...";

    try {

        const res = await fetch("/generate",{
            method:"POST",
            headers:{
                "Content-Type":"application/json",
                "Authorization":"Bearer " + localStorage.getItem("token")
            },
            body:JSON.stringify({product,audience,platform})
        });

        const data = await res.json();

        result.innerHTML = "<pre>"+JSON.stringify(data,null,2)+"</pre>";

    } catch(err){
        result.innerHTML = "Error generating";
    }
}

</script>

</body>
</html>
